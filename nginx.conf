# lessbook: static EPUB reader. The library is nginx's own JSON directory listing of ~/books;
# uploads are plain WebDAV PUTs to /upload/<folder>/<name>.epub (upload.html checks the file is an EPUB first).
# Runs as the compose `user`, so uploaded files belong to that user.
# Folder an upload goes into (from the decoded path), so a missing folder answers 404 instead of a failed write
map $uri $lessbook_upload_dir {
    ~^/upload/(?<lessbook_dir>.+)/[^/]+$  /books/$lessbook_dir;
    default                                /books;
}

server {
    listen 80;
    server_name _;
    root /srv/www;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Book files and directory listings (JSON, read by library.js)
    location /books/ {
        alias /books/;
        autoindex on;
        autoindex_format json;
        types { application/epub+zip epub; }
        default_type application/octet-stream;
        limit_except GET { deny all; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Upload: PUT /upload/<existing folder>/<name>.epub. Only .epub, max 200 MB, no hidden paths, never overwrites,
    # never creates folders. A prefix location + alias so nginx maps the decoded path (a regex capture kept %20s).
    # The body is buffered on the same disk as ~/books, so the final step is a rename.
    location /upload/ {
        limit_except PUT { deny all; }
        client_max_body_size 200m;
        if ($uri !~* "\.epub$") { return 403; }
        if ($uri ~ "/\.") { return 403; }
        if (!-d $lessbook_upload_dir) { return 404; }
        alias /books/;
        if (-e $request_filename) { return 409; }
        client_body_temp_path /books/.lessbook-tmp;
        dav_methods PUT;
        create_full_put_path off;
        dav_access user:rw group:r all:r;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
}
