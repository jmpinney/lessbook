# lessbook: lightweight browser EPUB reader. See README.md.
services:
  lessbook:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine
    container_name: lessbook
    restart: unless-stopped
    user: "1000:1000"                          # your `id -u`:`id -g`; uploads belong to this user
    volumes:
      - ./books:/books                         # your EPUB folder (must be writable for uploads)
      - ./www:/srv/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"                              # or drop this and join your reverse proxy's network (README)
