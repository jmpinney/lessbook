<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>upload · lessbook</title>
  <link rel="preload" href="/vendor/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="lib upload">
  <main class="term">
    <p class="banner"><b>lessbook</b> 1.0 · upload</p>
    <p class="field">
      <label for="dir">to</label>
      <select id="dir"><option value="">~/books</option></select>
    </p>
    <label class="drop" id="drop" for="file">
      <input type="file" id="file" accept=".epub,application/epub+zip" multiple>
      <span class="drop-text">[&nbsp;drop .epub files here, or tap to choose&nbsp;]</span>
      <span class="drop-hint">up to 200&nbsp;MB each · existing files are never replaced</span>
    </label>
    <ul id="log" aria-live="polite"></ul>
  </main>
  <footer class="keys">
    <span><kbd>Esc</kbd><a href="/" id="back">back to books</a></span>
  </footer>
  <script src="/vendor/jszip.min.js"></script>
  <script src="/upload.js"></script>
</body>
</html>
